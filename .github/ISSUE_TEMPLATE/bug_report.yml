name: Bug Report
description: Create a report to help us improve Atelier
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please search existing issues before submitting to avoid duplicates.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Atelier is experiencing the issue?
      options:
        - Taskbar / Dock
        - System Appearance (Mica / Acrylic / DWM)
        - Window Animations
        - Dynamic Island
        - Wallpapers / Direct3D 11
        - Audio Reactivity (WASAPI)
        - Studio UI (WebView2)
        - Installer / Packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers or contributors reproduce the problem?
      placeholder: |
        1. Open Studio
        2. Navigate to '...'
        3. Toggle '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows Version & Build
      placeholder: "e.g., Windows 11 Pro 23H2 (Build 22631.3007)"
    validations:
      required: true
  - type: input
    id: display_setup
    attributes:
      label: Display Setup
      placeholder: "e.g., Dual monitors, Primary 1440p @ 125% DPI, Secondary 1080p @ 100% DPI"
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Atelier Version / Commit
      placeholder: "e.g., v0.1.0 or git commit sha"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Console Output
      description: Paste any relevant terminal logs, crash traces, or WebView2 devtools output.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I have tested with the latest release or main branch.
          required: false
