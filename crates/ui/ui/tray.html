<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;background:transparent}body{font:12px/1.3 'Segoe UI Variable','Segoe UI',sans-serif;color:#f5f4f2}.panel{height:100%;padding:5px;background:#13151b;border:1px solid rgba(255,255,255,.12);border-radius:7px;overflow:auto}.metrics{display:flex;gap:18px;align-items:center;height:29px;padding:0 9px;border-bottom:1px solid rgba(255,255,255,.08);font-variant-numeric:tabular-nums}.label{color:#9b9da6;margin-right:5px}.value{font-weight:600}.actions{padding-top:3px}button{display:block;width:100%;height:24px;padding:0 9px;border:0;border-radius:4px;background:transparent;color:inherit;text-align:left;font:inherit;cursor:pointer}button:hover{background:rgba(255,255,255,.08)}button:focus-visible{outline:1px solid #e8e4dc;outline-offset:-1px}.separator{margin:3px 0;border-top:1px solid rgba(255,255,255,.08)}.quit{color:#e9aaa5}.error{color:#f0aba4;font-size:11px;padding:3px 9px}.error:empty{display:none}
</style></head><body><main class="panel">
<div class="metrics" aria-label="Atelier and related processes resource usage"><span><span class="label">CPU</span><span id="cpu" class="value">—</span></span><span><span class="label">RAM</span><span id="memory" class="value">—</span></span></div>
<div class="actions"><button data-action="show">Open Theme Studio</button><div class="separator"></div><button data-action="minimal clean">Minimal Clean</button><button data-action="cyberpunk neon">Cyberpunk Neon</button><button data-action="frosted glass">Frosted Glass</button><button data-action="nordic dark">Nordic Dark</button><div class="separator"></div><button data-action="reset">Restore Windows Defaults</button><button class="quit" data-action="quit">Quit Atelier</button></div>
<div class="error" role="status" id="error"></div>
</main><script src="tray.js"></script></body></html>
