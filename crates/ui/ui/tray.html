<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System tray</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden;font-family:'Segoe UI',sans-serif}body{padding:4px}.panel{height:100%;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(var(--tray-tint,30,30,34),var(--tray-alpha,.94));backdrop-filter:blur(24px);box-shadow:0 8px 25px #0005;overflow:auto;padding:8px}html[data-material="liquid"] .panel{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 40%,transparent),rgba(var(--tray-tint,22,24,34),calc(var(--tray-alpha,.9) * .14));border-color:rgba(255,255,255,.38);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 0 16px rgba(255,255,255,.06),inset 0 -1px 2px rgba(0,0,0,.3)}html[data-material="ios"] .panel{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05) 40%,rgba(255,255,255,.04)),rgba(var(--tray-tint,22,24,34),calc(var(--tray-alpha,.9) * .20));border-color:rgba(255,255,255,.45);box-shadow:inset 0 1px 1.5px rgba(255,255,255,.75),inset 0 -1px 2px rgba(0,0,0,.25)}.icons{display:grid;grid-template-columns:repeat(5,32px);grid-auto-rows:32px;gap:4px;align-content:start}.icon{display:grid;place-items:center;border:0;border-radius:6px;background:transparent;padding:5px;cursor:pointer}.icon:hover,.icon:focus-visible{background:#8884}.icon img{width:16px;height:16px;object-fit:contain}.status{font-size:11px;color:var(--tray-fg,#eee);padding:6px}.status:empty{display:none}
</style></head><body><main class="panel"><div class="icons" id="icons"></div><div class="status" id="status" role="status"></div></main><script src="tray.js"></script></body></html>
