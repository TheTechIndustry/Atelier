<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dynamic Island</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#f8f8fa;font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    button{font:inherit;color:inherit;cursor:pointer}
    #island{height:100%;width:100%;background:rgba(var(--bg,8,9,12),var(--opacity,.96));border-radius:var(--radius,24px);overflow:hidden;color:var(--text-color,#f8f8fa);font-size:var(--text-size,12px);box-shadow:inset 0 0 0 var(--border-width,0px) var(--border-color,#fff),inset 0 0 18px rgba(var(--audio-color,139,92,246),var(--audio-alpha,0));transition:box-shadow .15s ease}
    .compact{height:var(--compact-height,46px);width:100%;display:flex;align-items:center;position:relative;padding:4px 24px;cursor:pointer}
    .compact-content{display:flex;align-items:center;gap:8px;min-width:0;width:100%;height:100%;justify-content:var(--compact-align,flex-start)}
    .compact img{width:var(--art-size,30px);height:var(--art-size,30px);max-height:calc(100% - 4px);max-width:35%;flex:none;aspect-ratio:1;border-radius:7px;object-fit:cover}
    .compact .track{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
    .compact-time{white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
    .pulse{position:absolute;top:50%;transform:translateY(-50%);right:9px;color:#a9a5ff;font-size:16px}
    .compact.indicator-left .pulse{right:auto;left:9px}
    .expanded .compact{display:none!important}
    .body{display:none;height:100%;width:100%;position:relative;overflow:hidden;box-sizing:border-box}
    .expanded .body{display:flex;animation:reveal var(--reveal-duration,140ms) cubic-bezier(0.16,1,0.3,1)}
    @keyframes reveal{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
    .island-page-content{position:relative;flex:1;width:100%;height:100%;min-width:0;min-height:0;box-sizing:border-box}
    .island-page-content>div:not(.empty-message){position:absolute!important;min-width:0;min-height:0;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:14px;background:rgba(255,255,255,.05);backdrop-filter:blur(10px);box-sizing:border-box}
    .island-page-content>.empty-message{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.4)}
    .hidden{display:none!important}
  </style>
  <link rel="stylesheet" href="island-shape.css">
  <link rel="stylesheet" href="island-builder.css">
  <link rel="stylesheet" href="island-widgets.css">
</head>
<body>
  <div id="island">
    <div class="compact" id="compact" role="button" tabindex="0" aria-label="Open Dynamic Island">
      <div class="compact-content">
        <img id="small-art" alt="" hidden>
        <span class="track" id="small-title">Dynamic Island</span>
        <span class="compact-time hidden" id="small-time"></span>
      </div>
      <span class="pulse" id="small-state">●</span>
    </div>
    <div class="body" id="island-body">
      <button type="button" class="island-nav-arrow island-nav-prev" id="island-nav-prev" aria-label="Previous page" hidden><span>‹</span></button>
      <button type="button" class="island-nav-arrow island-nav-next" id="island-nav-next" aria-label="Next page" hidden><span>›</span></button>
      <nav id="island-page-nav" class="island-page-nav" aria-label="Island pages"></nav>
      <div class="island-page-content" id="island-content"></div>
    </div>
  </div>
  <script src="island-fit.js"></script>
  <script src="island-extras.js"></script>
  <script src="island-calendar.js"></script>
  <script src="island-lyrics.js"></script>
  <script src="island-module-preview.js"></script>
  <script src="island.js"></script>
</body>
</html>
