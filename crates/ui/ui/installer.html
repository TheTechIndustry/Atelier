<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atelier Setup</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: #ededf0; background: transparent; font: 13px/1.5 'Segoe UI Variable', 'Segoe UI', sans-serif; user-select: none; }
    button, input { font: inherit; }
    .window-frame { height: 100%; display: flex; flex-direction: column; border: 1px solid #37383d; background: transparent; }
    .titlebar { height: 45px; flex: none; display: flex; align-items: center; background: rgba(20,22,30,.12); border-bottom: 1px solid rgba(255,255,255,.07); }
    .titlebar-brand { padding-left: 24px; color: #a8a9b0; font-size: 12px; font-weight: 500; }
    .titlebar-drag { height: 100%; flex: 1; }
    .window-control { align-self: stretch; width: 46px; background: transparent; border: 0; color: #92939a; cursor: pointer; }
    .window-control:hover { background: #bd3541; color: white; }
    .window-control svg { width: 11px; height: 11px; }
    .content { flex: 1; min-height: 0; padding: 30px 38px 30px; display: flex; flex-direction: column; background: #151619; }
    .hero { display: flex; align-items: center; gap: 17px; margin-bottom: 30px; }
    .hero-icon { width: 52px; height: 52px; flex: none; border-radius: 12px; }
    h1 { margin: 0; font-size: 21px; line-height: 1.25; font-weight: 600; letter-spacing: -.3px; }
    .hero-text p { margin: 5px 0 0; color: #999aa2; font-size: 13px; }
    .version-tag { display: none; }
    .view-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .hidden { display: none !important; }
    .setup-card { display: flex; flex-direction: column; gap: 24px; }
    .field-group label { display: block; margin-bottom: 8px; color: #dedee1; font-size: 12px; font-weight: 600; }
    .input-row { display: flex; gap: 8px; }
    .text-input { flex: 1; min-width: 0; height: 38px; padding: 0 11px; color: #ededf0; background: #101114; border: 1px solid #414248; border-radius: 5px; outline: none; }
    .text-input:focus { border-color: #a5a6ae; }
    .btn-secondary, .btn-primary { height: 38px; padding: 0 17px; border-radius: 5px; cursor: pointer; font-weight: 600; }
    .btn-secondary { background: #242529; border: 1px solid #414248; color: #e9e9eb; }
    .btn-secondary:hover { background: #303136; }
    .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 145px; color: #171719; background: #e7e7e9; border: 1px solid #e7e7e9; }
    .btn-primary:hover { background: #fff; }
    .btn-primary:disabled { opacity: .45; cursor: default; }
    .options-grid { display: flex; flex-direction: column; gap: 12px; }
    .checkbox-label { display: flex; align-items: center; gap: 10px; color: #c6c6cb; cursor: pointer; }
    .checkbox-label input { width: 16px; height: 16px; margin: 0; accent-color: #dddde1; cursor: pointer; }
    .actions-bar { margin-top: auto; padding-top: 24px; display: flex; justify-content: flex-end; gap: 9px; border-top: 1px solid #2b2c30; }
    .progress-box { padding-top: 9px; }
    .progress-status { font-size: 15px; font-weight: 600; }
    .progress-track { height: 4px; margin-top: 20px; background: #38393e; border-radius: 4px; overflow: hidden; }
    .progress-fill { width: 0; height: 100%; background: #dedee1; transition: width .3s ease; }
    .progress-subtext { margin-top: 10px; color: #999aa2; }
    .finish-box { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 16px; }
    .finish-icon { width: 36px; height: 36px; display: grid; place-items: center; margin-bottom: 16px; border: 1px solid #5c5d63; border-radius: 50%; color: #e5e5e8; }
    .finish-icon svg { width: 19px; height: 19px; }
    .finish-title { font-size: 18px; font-weight: 600; }
    .finish-desc { max-width: 470px; margin-top: 7px; color: #a8a9b0; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="window-frame">
    <div class="titlebar">
      <div class="titlebar-brand">Setup</div>
      <div class="titlebar-drag" data-tauri-drag-region></div>
      <button class="window-control" id="btn-close" title="Exit Setup" aria-label="Exit Setup"><svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9m0-9l-9 9" stroke="currentColor" stroke-width="1.2" fill="none"/></svg></button>
    </div>
    <main class="content">
      <div class="hero">
        <img src="atelier-mark.svg" alt="" class="hero-icon">
        <div class="hero-text">
          <h1>Install Atelier <span class="version-tag" id="app-version"></span></h1>
          <p>Set up Atelier on your computer.</p>
        </div>
      </div>
      <div class="view-panel" id="view-options">
        <div class="setup-card">
          <div class="field-group">
            <label for="install-dir">Installation folder</label>
            <div class="input-row">
              <input type="text" id="install-dir" class="text-input" spellcheck="false">
              <button class="btn-secondary" id="btn-browse" type="button">Browse...</button>
            </div>
          </div>
          <div class="options-grid">
            <label class="checkbox-label"><input type="checkbox" id="chk-desktop" checked><span>Create desktop shortcut</span></label>
            <label class="checkbox-label"><input type="checkbox" id="chk-start" checked><span>Create Start menu shortcut</span></label>
            <label class="checkbox-label"><input type="checkbox" id="chk-startup"><span>Launch Atelier on Windows startup</span></label>
          </div>
        </div>
        <div class="actions-bar">
          <button class="btn-secondary" id="btn-cancel" type="button">Cancel</button>
          <button class="btn-primary" id="btn-install" type="button">Install Atelier</button>
        </div>
      </div>
      <div class="view-panel hidden" id="view-progress">
        <div class="progress-box">
          <div class="progress-status" id="progress-status">Preparing installation...</div>
          <div class="progress-track"><div class="progress-fill" id="progress-bar"></div></div>
          <div class="progress-subtext" id="progress-subtext">Copying application files...</div>
        </div>
      </div>
      <div class="view-panel hidden" id="view-finish">
        <div class="finish-box">
          <div class="finish-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div>
          <div class="finish-title">Atelier is ready</div>
          <div class="finish-desc" id="finish-desc">Atelier has been installed.</div>
        </div>
        <div class="actions-bar">
          <button class="btn-secondary" id="btn-finish-close" type="button">Close</button>
          <button class="btn-primary" id="btn-launch" type="button">Launch Atelier</button>
        </div>
      </div>
    </main>
  </div>
  <script src="installer.js"></script>
</body>
</html>
